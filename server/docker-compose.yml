services:
  signaling:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8787"
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-turn:turn.example.com:3478?transport=udp,turn:turn.example.com:3478?transport=tcp,turns:turn.example.com:5349?transport=tcp}
      TURN_SECRET: ${TURN_SECRET:?Set a strong shared secret also used by coturn}
      MAX_ROOMS: ${MAX_ROOMS:-500}
    expose: ["8787"]
    depends_on: [turn]
    networks: [constellation]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to a DNS name pointing at this server}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [signaling]
    networks: [constellation]
  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    command: >-
      -n --log-file=/dev/null --no-stdout-log --no-cli --fingerprint --lt-cred-mech
      --use-auth-secret --static-auth-secret=${TURN_SECRET:?Set TURN_SECRET}
      --realm=${TURN_REALM:-constellation.example.com}
      --listening-port=3478 --tls-listening-port=5349
      --cert=/certs/fullchain.pem --pkey=/certs/privkey.pem
      --min-port=49160 --max-port=49200
      --no-loopback-peers --no-multicast-peers
      --external-ip=${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP to the server public IP}
    volumes:
      - ${TURN_TLS_CERT_DIR:-./certs}:/certs:ro
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
      - "49160-49200:49160-49200/tcp"
    networks: [constellation]
networks:
  constellation:
    driver: bridge
volumes:
  caddy_data:
  caddy_config:

